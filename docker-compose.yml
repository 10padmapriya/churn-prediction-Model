version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      # python:3.12-slim has no curl, so probe /health with the standard library
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s   # model is trained at build time; this covers API startup

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000

networks:
  default:
    name: churn-net
