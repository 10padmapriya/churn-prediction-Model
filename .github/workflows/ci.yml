name: Churn Predictor CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint + type check
  # ──────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint deps
        run: pip install ruff black isort

      - name: Ruff (linting)
        run: ruff check src/ tests/ train_pipeline.py

      - name: Black (formatting check)
        run: black --check src/ tests/ train_pipeline.py

      - name: isort (import order)
        run: isort --profile black --check-only src/ tests/ train_pipeline.py

  # ──────────────────────────────────────────────────────────────
  # Job 2: Unit tests
  # ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -L "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv" \
            -o data/raw/telco_churn.csv
          echo "Dataset downloaded: $(wc -l < data/raw/telco_churn.csv) lines"

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  # ──────────────────────────────────────────────────────────────
  # Job 3: Training pipeline + model quality gate
  # ──────────────────────────────────────────────────────────────
  train-and-validate:
    name: Train Pipeline + Quality Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -L "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv" \
            -o data/raw/telco_churn.csv

      - name: Run training pipeline
        run: python train_pipeline.py

      - name: Model quality gate
        # Fails the build if the model doesn't meet minimum standards.
        # This prevents a bad model from getting deployed.
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("data/processed/eval_metrics.json") as f:
              metrics = json.load(f)

          best = metrics["best_model"]
          m = metrics["models"][best]

          print(f"Best model: {best}")
          print(f"  ROC-AUC : {m['roc_auc']:.4f}")
          print(f"  Recall  : {m['recall']:.4f}")
          print(f"  Net value: ${m['net_value_usd']:,.0f}")

          # Enforce minimum quality thresholds
          failures = []
          if m["roc_auc"] < 0.80:
              failures.append(f"ROC-AUC {m['roc_auc']:.4f} < 0.80 minimum")
          if m["recall"] < 0.75:
              failures.append(f"Recall {m['recall']:.4f} < 0.75 minimum")
          if m["net_value_usd"] < 400_000:
              failures.append(f"Net value ${m['net_value_usd']:,.0f} < $400,000 minimum")

          if failures:
              print("\n❌ Quality gate FAILED:")
              for f in failures:
                  print(f"   - {f}")
              sys.exit(1)
          else:
              print("\n✅ Quality gate PASSED — model meets all thresholds")
          EOF

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: data/processed/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Job 4: API smoke test
  # ──────────────────────────────────────────────────────────────
  api-smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: train-and-validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -L "https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv" \
            -o data/raw/telco_churn.csv

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: data/processed/

      - name: Start API in background
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5  # wait for startup

      - name: Health check
        run: |
          response=$(curl -sf http://localhost:8000/health)
          echo "Health response: $response"
          echo "$response" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['status'] == 'ok', f'Health check failed: {d}'
          assert d['model_loaded'] == True, 'Model not loaded'
          print('✅ Health check passed')
          "

      - name: Predict endpoint test
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "gender": "Male",
              "SeniorCitizen": 0,
              "Partner": "No",
              "Dependents": "No",
              "tenure": 3,
              "PhoneService": "Yes",
              "MultipleLines": "No",
              "InternetService": "Fiber optic",
              "OnlineSecurity": "No",
              "OnlineBackup": "No",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "Yes",
              "StreamingMovies": "Yes",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 89.5,
              "TotalCharges": 268.5
            }' | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'churn_probability' in d
          assert 0 <= d['churn_probability'] <= 1
          assert 'risk_tier' in d
          assert d['risk_tier'] in ('Low', 'Medium', 'High')
          print(f'✅ Predict endpoint passed — prob={d[\"churn_probability\"]:.4f}, tier={d[\"risk_tier\"]}')
          "

      - name: Performance endpoint test
        run: |
          curl -sf http://localhost:8000/model/performance | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'best_model' in d
          assert 'models' in d
          print(f'✅ Performance endpoint passed — best model: {d[\"best_model\"]}')
          "

  # ──────────────────────────────────────────────────────────────
  # Job 5: Build Docker image (main branch only)
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: api-smoke-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-predictor:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-container -p 8000:8000 churn-predictor:${{ github.sha }}
          sleep 15  # wait for startup + training
          curl -sf http://localhost:8000/health && echo "✅ Container health check passed"
          docker stop test-container

      # Uncomment to push to Docker Hub or GHCR:
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Push image
      #   run: docker push churn-predictor:${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  # Job 6: Frontend build check
  # ──────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # Run in parallel with train-and-validate — no dependency needed
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build React app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
